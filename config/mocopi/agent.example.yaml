robot_config: tracking.yaml

# Replace the device IDs on the machine that runs the robot. They are examples
# only and are not inferred from the connected hardware.
cameras:
  - id: head
    device: /dev/video0
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    coordinate_frame: head_camera_uncalibrated
  - id: left_wrist
    device: /dev/video2
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    coordinate_frame: left_wrist_camera_uncalibrated
  - id: right_wrist
    device: /dev/video4
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    coordinate_frame: right_wrist_uncalibrated

# The operator creates this file outside Git and supplies its value to the MCP
# tool only when motion is intentionally enabled. The LLM cannot discover it.
authorization_token_file: /run/user/1000/scorpion-agent-motion.token
max_feedback_age_s: 0.5
max_plan_frames: 240
execution_report_dir: outputs/agent/executions
