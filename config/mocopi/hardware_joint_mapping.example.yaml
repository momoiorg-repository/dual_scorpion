# Example only. Do not use this file for hardware replay.
# Generate the real mapping with independent per-joint verification (no whole-body posing):
#   PYTHONPATH=telegrip_teleoperation uv run --no-sync python -m telegrip.mocopi.dataset verify-dataset-mapping --mode joint-wise ...
#
# The mapping formula is motor = sign * model + offset_deg.
# offset_deg is the motor angle at MuJoCo model zero.  The calibration zero
# (MotorNormMode.DEGREES = 0) is a different pose and is represented by
# model_at_calibration_zero_deg = -offset_deg / sign.
#
# A real mapping also contains, for every joint on each side:
#   sides.<side>.joint_verification.<joint>:
#     schema: dual_scorpion.mocopi.hardware_joint_verification.v1
#     side, joint, motor_id, motor_model, method, verification_method, verified
#     model_joint, parent_link, child_link, model_axis, calibration
#     model_angles_deg, motor_angles_deg, model_range_deg
#     slope, sign, offset_deg, rms_deg, max_residual_deg
#     positive_delta_deg, negative_delta_deg
#     scale_basis, scale_verified, evidence, verification_evidence, failures
# Partial mappings use null for unmeasured joints. Calibration midpoint mappings carry
# assumed signs and offsets with verification_status: calibration_assumed.
# Replay requires physically_verified status derived from all 14 joint records.
schema: dual_scorpion.mocopi.hardware_joint_mapping.v1
robot_id: CHANGE_ME
calibration_sha256: CHANGE_ME
mujoco_model_sha256: CHANGE_ME
dataset: null
dataset_sha256: null
dataset_manifest_sha256: null
episode: null
verified: false
verification_status: partial
model_kind: full_mujoco
verification_method: per_joint_reference
created_at: null
verification: null
sides:
  right:
    sign: [null, null, null, null, null, null, null]
    offset_deg: [null, null, null, null, null, null, null]
    # Add measured joint_limits_deg.min / .max in motor degrees in joint0..6 order,
    # inside the calibrated ranges, and joint_limits_evidence documenting how the
    # physical, wrist and cable bounds were established. Required on both sides for replay.
  left:
    sign: [null, null, null, null, null, null, null]
    offset_deg: [null, null, null, null, null, null, null]
