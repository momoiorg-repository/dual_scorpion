# Use the measured robot and three camera IDs from a local HarnessConfig.
robot:
  adapter: dual_scorpion
  config: ../mocopi/agent.local.yaml
  options:
    camera_ids:
      head: head
      right_wrist: right_wrist
      left_wrist: left_wrist
